name: Detect CV file

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "scripts/detect_cv.py"
      - ".github/workflows/update-cv.yml"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect CV file and update cv.json
        run: python scripts/detect_cv.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain data/cv.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/cv.json
            git commit -m "chore: update detected CV filename"
            git push
          else
            echo "No CV change."
          fi
