name: Update generated files

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "data/content.yml"
      - "scripts/detect_cv.py"
      - "scripts/sync_head.py"
      - "scripts/site_meta.py"
      - ".github/workflows/update-generated.yml"
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect CV file and update cv.json
        run: python scripts/detect_cv.py

      - name: Sync index.html head from content.yml
        run: python scripts/sync_head.py

      - name: Commit changes if any
        run: |
          if [[ -n "$(git status --porcelain data/cv.json index.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/cv.json index.html
            git commit -m "chore: update generated files from content.yml"
            git push
          else
            echo "No changes."
          fi
