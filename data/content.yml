about:
  - "I am currently a postdoctoral researcher with Dr. Corinne Scown at the University of California, Berkeley and an affiliate at the Joint Bioenergy Institute (JBEI) at Lawrence Berkeley National Lab. I work on advanced computational methods for process simulation and evaluation under uncertainty, with applications in biomanufacturing, catalysis, separations, and wastewater resource recovery. I am the lead developer of [NSKinetics](https://github.com/sarangbhagwat/nskinetics) and the [Standard Flowsheet Format (SFF) and export](https://github.com/sustainability-software-lab/pisces-standard-flowsheet-format) underlying [Project PISCES](https://projectpisces.org/). I am also a core developer of [BioSTEAM](https://github.com/BioSTEAMDevelopmentGroup/biosteam)."
  - "I completed my Ph.D. in 2025 with Prof. Jeremy Guest at the University of Illinois Urbana-Champaign. My doctoral research focused on creating an inter-disciplinary platform that drives large-scale team science at the DOE Center for Advanced Bioenergy and Bioproducts Innovation (CABBI) by integrating process engineering with rigorous uncertainty and sensitivity analyses. I create tools to design, simulate, and evaluate (through techno-economic analysis, TEA, and life cycle assessment, LCA) emerging technologies under uncertainty. I leverage these tools to actively shape design-build-test-learn cycles and quantitatively prioritize R&D needs."
education:
  - { degree: "Ph.D., Civil & Environmental Engineering", institution: "University of Illinois Urbana-Champaign", year: "2025" }
  - { degree: "M.S., Civil & Environmental Engineering", institution: "North Carolina State University", year: "2019" }
  - { degree: "B.S., Chemical Technology (Oils, Oleochemicals, and Surfactants)", institution: "Institute of Chemical Technology, Mumbai/Bombay", year: "2017" }
research_interests:
  - { heading: "Process Systems Engineering; Data Analytics; Circular Economy; Biomanufacturing" }
  - { body: "Process synthesis, design, and simulation under uncertainty" }
  - { body: "Discover and prioritize biomanufacturing pathways through physics-informed AI & ML" }
  - { body: "Develop open-source tools for techno-economic analysis (TEA) and life cycle assessment (LCA)" }
  - { body: "Navigate economic and environmental trade-offs in R&D decisions" }

# --- Software / research tools -------------------------------------------------
# `repo` is "owner/name"; the software-metrics sync (scripts/sync_software.py)
# reads repo:/pypi: lines here, fetches stars/downloads, and writes
# data/software.json. Leave `pypi` off for tools not published to PyPI.
software:
  - name: "NSKinetics"
    role: "Lead developer"
    description: "Open-source toolkit for defining and simulating (bio)chemical reaction networks within process flowsheets. Propagates kinetic uncertainties to facility-scale outcomes."
    repo: "sarangbhagwat/nskinetics"
    pypi: "nskinetics"                      # TODO: confirm the PyPI package name
    url: "https://github.com/sarangbhagwat/nskinetics"
  - name: "PISCES Standard Flowsheet Format (SFF)"
    role: "Lead developer"
    description: "An interoperable format and export layer for process flowsheets, underlying [Project PISCES](https://projectpisces.org/)."
    repo: "sustainability-software-lab/pisces-standard-flowsheet-format"
    url: "https://projectpisces.org/"
  - name: "BioSTEAM"
    role: "Core developer"
    description: "Fast, open-source platform for the design, simulation, and techno-economic analysis of biorefineries under uncertainty."
    repo: "BioSTEAMDevelopmentGroup/biosteam"
    pypi: "biosteam"
    url: "https://biosteam.readthedocs.io/"

