about:
  - "I am currently a postdoctoral researcher with Dr. Corinne Scown at the University of California, Berkeley and an affiliate at the Joint Bioenergy Institute (JBEI) at Lawrence Berkeley National Lab. I work on advanced computational methods for process simulation and evaluation under uncertainty, with applications in biomanufacturing, catalysis, separations, and wastewater resource recovery. I am the lead developer of [NSKinetics](https://github.com/sarangbhagwat/nskinetics) and the [Standard Flowsheet Format (SFF) and export](https://github.com/sustainability-software-lab/pisces-standard-flowsheet-format) underlying [Project PISCES](https://projectpisces.org/). I am also a core developer of [BioSTEAM](https://github.com/BioSTEAMDevelopmentGroup/biosteam)."
  - "I completed my Ph.D. in 2025 with Prof. Jeremy Guest at the University of Illinois Urbana-Champaign. My doctoral research focused on creating an inter-disciplinary platform that drives large-scale team science at the DOE Center for Advanced Bioenergy and Bioproducts Innovation (CABBI) by integrating process engineering with rigorous uncertainty and sensitivity analyses. I create tools to design, simulate, and evaluate (through techno-economic analysis, TEA, and life cycle assessment, LCA) emerging technologies under uncertainty. I leverage these tools to actively shape design-build-test-learn cycles and quantitatively prioritize R&D needs."
