  - { degree: "M.S., Civil & Environmental Engineering", institution: "North Carolina State University", year: "2019" }
  - { degree: "B.S., Chemical Technology (Oils, Oleochemicals, and Surfactants)", institution: "Institute of Chemical Technology, Mumbai/Bombay", year: "2017" }
research_interests:
  - { heading: "Process Systems Engineering; Data Analytics; Circular Economy; Biomanufacturing" }
  - { body: "Process synthesis, design, and simulation under uncertainty" }
  - { body: "Discover and prioritize biomanufacturing pathways through physics-informed AI & ML" }
  - { body: "Develop open-source tools for techno-economic analysis (TEA) and life cycle assessment (LCA)" }
  - { body: "Navigate economic and environmental trade-offs in R&D decisions" }

# --- Software / research tools -------------------------------------------------
# `repo` is "owner/name"; the software-metrics sync (scripts/sync_software.py)
# reads repo:/pypi: lines here, fetches stars/downloads, and writes
# data/software.json. Leave `pypi` off for tools not published to PyPI.
software:
  - name: "NSKinetics"
    role: "Lead developer"
    description: "Open-source toolkit for defining and simulating (bio)chemical reaction networks and non-steady-state kinetics."
    repo: "sarangbhagwat/nskinetics"
    pypi: "nskinetics"                      # TODO: confirm the PyPI package name
    url: "https://github.com/sarangbhagwat/nskinetics"
  - name: "Standard Flowsheet Format (SFF)"
    role: "Lead developer"
    description: "An interoperable format and export layer for process flowsheets, underlying [Project PISCES](https://projectpisces.org/)."
    repo: "sustainability-software-lab/pisces-standard-flowsheet-format"
    url: "https://projectpisces.org/"
  - name: "BioSTEAM"
    role: "Core developer"
    description: "Fast, open-source platform for the design, simulation, and techno-economic analysis of biorefineries under uncertainty."
    repo: "BioSTEAMDevelopmentGroup/biosteam"
    pypi: "biosteam"
    url: "https://biosteam.readthedocs.io/"

