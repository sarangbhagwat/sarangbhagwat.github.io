<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sarang S. Bhagwat</title>
  <meta name="description" content="Personal website of Sarang S. Bhagwat, Postdoctoral Researcher, University of California, Berkeley." />
  <script>
    // Set the theme before first paint to avoid a flash of the wrong palette.
    // Uses the saved choice if present, otherwise the OS preference. The toggle
    // and live OS-following are wired up later in js/main.js.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved || (dark ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="site-header">
    <nav id="site-nav" aria-label="Primary">
      <a class="nav-name" href="#hero">Your Name</a>
      <div class="nav-right">
        <ul class="nav-links">
          <li><a href="#about">About</a></li>
          <li><a href="#research">Research</a></li>
          <li><a href="#publications">Publications</a></li>
          <li><a href="#teaching">Teaching</a></li>
          <li><a href="#awards">Awards</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme"></button>
      </div>
    </nav>
  </header>

  <main>
    <section id="hero">
      <div class="hero-grid">
        <div class="hero-col">
          <img id="hero-photo" src="assets/headshot.jpg" alt="" />
          <h1 id="hero-name"></h1>
          <p id="hero-title"></p>
          <p id="hero-tagline"></p>
        </div>
        <div id="education" class="edu-col">
          <h2 id="education-heading">Education</h2>
          <ul id="education-list"></ul>
        </div>
      </div>
      <div class="hero-footer">
        <p class="hero-actions">
          <a id="hero-cv" href="#" class="button">Download CV</a>
        </p>
        <ul id="hero-links" class="icon-links"></ul>
      </div>
    </section>

    <section id="about">
      <h2>About</h2>
      <div id="about-body"></div>
    </section>

    <section id="research">
      <h2>Research interests</h2>
      <div id="research-list"></div>
    </section>

    <section id="publications">
      <h2>Publications</h2>
      <p><a id="scholar-link" href="#">See all on Google Scholar</a></p>
      <div id="publications-list"></div>
    </section>

    <section id="teaching">
      <h2>Teaching</h2>
      <div id="teaching-philosophy"></div>
      <h3 id="courses-heading">Courses</h3>
      <ul id="teaching-courses"></ul>
    </section>

    <section id="awards">
      <h2>Awards and honors</h2>
      <ul id="awards-list"></ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <ul id="contact-list"></ul>
    </section>
  </main>

  <footer id="site-footer">
    <p>&copy; <span id="footer-year"></span> <span id="footer-name"></span></p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
